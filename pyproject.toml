[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["old", "*.ipynb"]

[tool.ruff.lint]
select = ["D100", "D101", "D102", "D103", "F", "I"]

[tool.basedpyright]
include = ["*.py"]
exclude = ["old", ".conda", ".venv", "input", "output"]
venvPath = "."
venv = ".conda"
reportUnnecessaryCast = "error"
failOnWarnings = false

[tool.vulture]
# vulture does not expand globs, so add each new top-level module here
paths = [
  "main.py",
  "raster_preparation.py",
  "utilities.py",
  "wrd_flows.py",
  "network_indices.py",
  "conus_maps.py",
]

[tool.codespell]
skip = "./old,./input,./output,./.conda,./.venv,*.ipynb"
# MOR is the Missouri Region basin
ignore-words-list = "mor"
